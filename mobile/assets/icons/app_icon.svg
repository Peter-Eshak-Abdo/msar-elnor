<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="lightBeam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="#F59E0B" stroke-width="6" stroke-opacity="0.4" />
  <polygon points="256,120 100,430 412,430" fill="url(#lightBeam)" />
  <circle cx="256" cy="180" r="110" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6,8" stroke-opacity="0.5" />
  <circle cx="256" cy="180" r="85" fill="#F59E0B" fill-opacity="0.15" filter="url(#glow)" />

  <rect x="244" y="110" width="24" height="150" rx="12" fill="url(#goldGrad)" filter="url(#glow)" />
  <rect x="196" y="145" width="120" height="24" rx="12" fill="url(#goldGrad)" filter="url(#glow)" />

  <polygon points="216,330 296,330 320,410 192,410" fill="#1E293B" stroke="#F59E0B" stroke-width="4" />
  <rect x="236" y="270" width="40" height="60" rx="8" fill="#334155" stroke="#F59E0B" stroke-width="3" />
  <polygon points="256,230 220,270 292,270" fill="url(#goldGrad)" />
  <circle cx="256" cy="157" r="16" fill="#FFFFFF" filter="url(#glow)" />

  <text x="256" y="460" text-anchor="middle" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" letter-spacing="2">
    مسار النور
  </text>
</svg>
